<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股類股漲幅報表</title>
<style>
  :root { --up:214,69,61; --down:26,152,80; --bg:#fafafa; --line:#e5e5e5; }
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft JhengHei",sans-serif; margin:0; background:var(--bg); color:#222; }
  header { padding:16px 24px 8px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#777; font-size:12px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; padding:8px 24px; align-items:center; }
  .controls input, .controls select { padding:6px 10px; border:1px solid #ccc; border-radius:6px; font-size:13px; background:#fff; }
  .tabs { display:flex; border:1px solid #ccc; border-radius:6px; overflow:hidden; }
  .tabs button { border:0; background:#fff; padding:7px 14px; font-size:13px; cursor:pointer; border-right:1px solid #ccc; }
  .tabs button:last-child { border-right:0; }
  .tabs button.on { background:#2b5d9b; color:#fff; }
  .view { padding:0 24px 40px; }
  .tbl-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th, td { padding:6px 9px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:#f0f0f0; cursor:pointer; user-select:none; position:sticky; top:0; text-align:right; z-index:1; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align:left; }
  th.nosort { cursor:default; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.sector { cursor:pointer; }
  tr.sector:hover td:nth-child(-n+3) { background:#eef4fc; }
  tr.stock { background:#fcfcfc; color:#444; font-size:12px; }
  tr.stock td:first-child { padding-left:28px; }
  .arrow { color:#999; font-size:10px; }
  .bar { display:inline-block; height:8px; background:#c8d9f0; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #tmBox { position:relative; height:520px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tile { position:absolute; border:1px solid #fff; border-radius:2px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; line-height:1.25; }
  .tile span { font-size:12px; white-space:nowrap; }
  .tile .v { font-size:11px; color:#555; }
  .crumb { font-size:13px; margin:0 0 8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .crumb button { padding:4px 10px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; font-size:12px; }
  #scBox { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .legend { font-size:12px; color:#777; margin-top:6px; }
  svg text { font-family:inherit; }
</style>
</head>
<body>
<header>
  <h1>台股類股漲幅報表 <span id="hdate" style="font-weight:400;font-size:14px;color:#777;"></span></h1>
  <div class="sub" id="hsub"></div>
</header>
<div class="controls">
  <div class="tabs" id="tabs">
    <button data-v="table" class="on">表格</button>
    <button data-v="map">市場地圖</button>
    <button data-v="scatter">動能散點</button>
  </div>
  <select id="parentSel"><option value="">全部大類</option></select>
  <input id="search" placeholder="搜尋類股 / 個股代碼名稱" size="22">
  <span class="sub" id="hint"></span>
</div>

<div class="view" id="v-table">
  <div class="tbl-wrap">
  <table id="tbl">
    <thead><tr>
      <th data-k="parent">大類</th><th data-k="name">子類股 / 成交比重</th><th data-k="count">檔數 / 股價</th>
      <th data-k="turnover">成交金額(億)</th>
      <th data-k="d">當日%</th><th data-k="w1">1w%</th><th data-k="m1">1m%</th>
      <th data-k="m3">3m%</th><th data-k="m6">6m%</th><th data-k="m12">12m%</th>
      <th class="nosort">1y 走勢</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  </div>
</div>

<div class="view" id="v-map" style="display:none;">
  <div class="crumb">
    <button id="tmBack" style="display:none;">← 返回類股</button>
    <span id="tmTitle">全部類股</span>
    <span style="flex:1"></span>
    <label class="sub">顏色:<select id="tmMetric">
      <option value="d">當日%</option><option value="w1">1w%</option><option value="m1">1m%</option>
      <option value="m3">3m%</option><option value="m6">6m%</option><option value="m12">12m%</option>
    </select></label>
  </div>
  <div id="tmBox"></div>
  <div class="legend">面積 = 當日成交金額;顏色 = 所選尺度漲跌(紅漲綠跌,深度為相對強弱)。點磁磚下鑽到成份股。</div>
</div>

<div class="view" id="v-scatter" style="display:none;">
  <div class="crumb">
    <label class="sub">X:<select id="scX">
      <option value="d">當日%</option><option value="w1">1w%</option><option value="m1" selected>1m%</option>
      <option value="m3">3m%</option><option value="m6">6m%</option><option value="m12">12m%</option>
    </select></label>
    <label class="sub">Y:<select id="scY">
      <option value="d">當日%</option><option value="w1" selected>1w%</option><option value="m1">1m%</option>
      <option value="m3">3m%</option><option value="m6">6m%</option><option value="m12">12m%</option>
    </select></label>
    <span class="sub">泡泡大小 = 成交金額,顏色 = 當日漲跌;右上 = 雙強、左上 = 短強長弱(補漲)、右下 = 短弱長強(回檔)</span>
  </div>
  <div id="scBox"></div>
</div>

<script src="data.js"></script>
<script>
const R = window.REPORT;
const METRICS = ['d','w1','m1','m3','m6','m12'];
const LBL = { d: '當日%', w1: '1w%', m1: '1m%', m3: '3m%', m6: '6m%', m12: '12m%' };
const fmt = v => v == null ? '--' : v.toFixed(Math.abs(v) >= 100 ? 0 : 2);
document.getElementById('hdate').textContent = R.date;
document.getElementById('hsub').textContent =
  '當日成交金額占比加權 ・ 還原權息 ・ 基準日 1w:' + R.baseDates.w1 + ' / 1m:' + R.baseDates.m1 +
  ' / 3m:' + R.baseDates.m3 + ' / 6m:' + R.baseDates.m6 + ' / 12m:' + R.baseDates.m12;

function p90(vals) {
  const a = vals.filter(v => v != null).map(Math.abs).sort((x, y) => x - y);
  return a.length ? Math.max(a[Math.floor((a.length - 1) * 0.9)], 0.5) : 1;
}
const SCALE_SEC = {}, SCALE_STK = {};
for (const k of METRICS) {
  SCALE_SEC[k] = p90(R.sectors.map(s => s[k]));
  SCALE_STK[k] = p90(R.sectors.flatMap(s => s.stocks.map(x => x[k])));
}
function heat(v, scale) {
  if (v == null) return '';
  const a = Math.min(Math.abs(v) / scale, 1) * 0.82;
  return 'background:rgba(' + (v >= 0 ? '214,69,61' : '26,152,80') + ',' + a.toFixed(3) + ');';
}
const cellSec = (v, k) => '<td class="num" style="' + heat(v, SCALE_SEC[k]) + '">' + fmt(v) + '</td>';
const cellStk = (v, k) => '<td class="num" style="' + heat(v, SCALE_STK[k]) + '">' + fmt(v) + '</td>';

function sparkSvg(sp) {
  if (!sp || sp.length < 2) return '';
  const vals = []; let prev = 0;
  for (const v of sp) { prev = v == null ? prev : v; vals.push(prev); }
  const w = 110, h = 26, pad = 2;
  const mn = Math.min(0, ...vals), mx = Math.max(0, ...vals), rng = mx - mn || 1;
  const X = i => pad + i * (w - 2 * pad) / (vals.length - 1);
  const Y = v => pad + (mx - v) * (h - 2 * pad) / rng;
  const pts = vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
  const c = vals[vals.length - 1] >= 0 ? 'rgb(214,69,61)' : 'rgb(26,152,80)';
  return '<svg width="' + w + '" height="' + h + '" style="vertical-align:middle;">' +
    '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="#ddd"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + c + '" stroke-width="1.3"/></svg>';
}

function filtered() {
  const parent = document.getElementById('parentSel').value;
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = R.sectors.filter(s => !parent || s.parent === parent);
  if (q) rows = rows.filter(s =>
    s.name.toLowerCase().includes(q) || s.parent.includes(q) ||
    s.stocks.some(x => x.id.includes(q) || x.name.toLowerCase().includes(q)));
  return rows;
}

// ---------- 表格 ----------
let sortKey = 'd', sortDir = -1, expanded = new Set();
function renderTable() {
  let rows = filtered().slice().sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') return va.localeCompare(vb, 'zh-TW') * -sortDir;
    return ((va ?? -9999) - (vb ?? -9999)) * sortDir;
  });
  document.querySelector('#tbl tbody').innerHTML = rows.map(s => {
    const key = s.parent + '|' + s.name;
    const open = expanded.has(key);
    let h = '<tr class="sector" data-key="' + key + '">' +
      '<td>' + s.parent + '</td>' +
      '<td><span class="arrow">' + (open ? '▼' : '▶') + '</span> ' + s.name + '</td>' +
      '<td class="num">' + s.count + '</td>' +
      '<td class="num">' + (s.turnover / 1e8).toFixed(1) + '</td>' +
      METRICS.map(k => cellSec(s[k], k)).join('') +
      '<td>' + sparkSvg(s.spark) + '</td></tr>';
    if (open) {
      h += s.stocks.map(x =>
        '<tr class="stock"><td>' + x.id + ' ' + x.name + '</td>' +
        '<td><span class="bar" style="width:' + Math.min(100, x.weight * 2) + 'px"></span>' + x.weight.toFixed(1) + '%</td>' +
        '<td class="num">' + x.close + '</td>' +
        '<td class="num">' + (x.turnover / 1e8).toFixed(1) + '</td>' +
        METRICS.map(k => cellStk(x[k], k)).join('') + '<td></td></tr>').join('');
    }
    return h;
  }).join('');
}
document.querySelectorAll('#tbl th[data-k]').forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
  renderTable();
});
document.querySelector('#tbl tbody').onclick = e => {
  const tr = e.target.closest('tr.sector');
  if (!tr) return;
  expanded.has(tr.dataset.key) ? expanded.delete(tr.dataset.key) : expanded.add(tr.dataset.key);
  renderTable();
};

// ---------- 市場地圖 ----------
let tmSector = null;
function squarify(items, W, H) {
  const total = items.reduce((s, i) => s + i.v, 0);
  const scaled = items.map(i => ({ ...i, area: i.v / total * W * H })).filter(i => i.area > 0);
  const rects = [];
  let x = 0, y = 0, w = W, h = H, row = [];
  const worst = r => {
    const len = Math.min(w, h);
    const s = r.reduce((a, t) => a + t.area, 0);
    const mx = Math.max(...r.map(t => t.area)), mn = Math.min(...r.map(t => t.area));
    return Math.max(len * len * mx / (s * s), s * s / (len * len * mn));
  };
  const place = r => {
    const s = r.reduce((a, t) => a + t.area, 0);
    if (w < h) {
      const rh = s / w; let rx = x;
      for (const t of r) { const rw = t.area / rh; rects.push({ ...t, x: rx, y, w: rw, h: rh }); rx += rw; }
      y += rh; h -= rh;
    } else {
      const rw = s / h; let ry = y;
      for (const t of r) { const rh2 = t.area / rw; rects.push({ ...t, x, y: ry, w: rw, h: rh2 }); ry += rh2; }
      x += rw; w -= rw;
    }
  };
  for (const it of scaled) {
    if (row.length && worst([...row, it]) > worst(row)) { place(row); row = [it]; }
    else row.push(it);
  }
  if (row.length) place(row);
  return rects;
}
function renderMap() {
  const k = document.getElementById('tmMetric').value;
  const box = document.getElementById('tmBox');
  const W = box.clientWidth || 1000, H = box.clientHeight || 520;
  let items, scale;
  if (tmSector) {
    items = tmSector.stocks.map(x => ({ v: x.turnover, label: x.id + ' ' + x.name, val: x[k], obj: null, full: x }));
    scale = SCALE_STK[k];
    document.getElementById('tmTitle').textContent = tmSector.parent + ' > ' + tmSector.name;
    document.getElementById('tmBack').style.display = '';
  } else {
    items = filtered().map(s => ({ v: s.turnover, label: s.name, val: s[k], obj: s, full: s }));
    scale = SCALE_SEC[k];
    document.getElementById('tmTitle').textContent = '全部類股';
    document.getElementById('tmBack').style.display = 'none';
  }
  items.sort((a, b) => b.v - a.v);
  const rects = squarify(items, W, H);
  box.innerHTML = rects.map((r, i) => {
    const f = r.full;
    const tip = r.label + '&#10;成交金額 ' + (r.v / 1e8).toFixed(1) + ' 億&#10;' +
      METRICS.map(m => LBL[m] + ' ' + fmt(f[m])).join('&#10;');
    const showName = r.w > 52 && r.h > 18;
    const showVal = r.w > 52 && r.h > 34;
    return '<div class="tile" data-i="' + i + '" title="' + tip + '" style="left:' + r.x.toFixed(1) + 'px;top:' + r.y.toFixed(1) +
      'px;width:' + r.w.toFixed(1) + 'px;height:' + r.h.toFixed(1) + 'px;' + (heat(r.val, scale) || 'background:#f2f2f2;') + '">' +
      (showName ? '<span>' + r.label + '</span>' : '') +
      (showVal ? '<span class="v">' + (r.val > 0 ? '+' : '') + fmt(r.val) + '%</span>' : '') + '</div>';
  }).join('');
  box.querySelectorAll('.tile').forEach(t => t.onclick = () => {
    const it = rects[+t.dataset.i];
    if (!tmSector && it.obj) { tmSector = it.obj; renderMap(); }
  });
}
document.getElementById('tmBack').onclick = () => { tmSector = null; renderMap(); };
document.getElementById('tmMetric').onchange = renderMap;

// ---------- 動能散點 ----------
function niceTicks(mn, mx, n) {
  const span = mx - mn || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let t = Math.ceil(mn / step) * step; t <= mx + 1e-9; t += step) out.push(+t.toFixed(6));
  return out;
}
function renderScatter() {
  const kx = document.getElementById('scX').value, ky = document.getElementById('scY').value;
  const rows = filtered().filter(s => s[kx] != null && s[ky] != null);
  if (!rows.length) { document.getElementById('scBox').innerHTML = ''; return; }
  const W = 980, H = 520, M = { l: 56, r: 20, t: 16, b: 40 };
  let xmn = Math.min(0, ...rows.map(s => s[kx])), xmx = Math.max(0, ...rows.map(s => s[kx]));
  let ymn = Math.min(0, ...rows.map(s => s[ky])), ymx = Math.max(0, ...rows.map(s => s[ky]));
  const xp = (xmx - xmn) * 0.08 || 1, yp = (ymx - ymn) * 0.08 || 1;
  xmn -= xp; xmx += xp; ymn -= yp; ymx += yp;
  const X = v => M.l + (v - xmn) / (xmx - xmn) * (W - M.l - M.r);
  const Y = v => H - M.b - (v - ymn) / (ymx - ymn) * (H - M.t - M.b);
  const maxT = Math.max(...rows.map(s => s.turnover), 1);
  const labelSet = new Set(rows.slice().sort((a, b) => b.turnover - a.turnover).slice(0, 14));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block;">';
  for (const t of niceTicks(xmn, xmx, 8)) g += '<line x1="' + X(t) + '" x2="' + X(t) + '" y1="' + M.t + '" y2="' + (H - M.b) + '" stroke="' + (t === 0 ? '#999' : '#eee') + '"/>' +
    '<text x="' + X(t) + '" y="' + (H - M.b + 16) + '" font-size="11" fill="#888" text-anchor="middle">' + t + '</text>';
  for (const t of niceTicks(ymn, ymx, 7)) g += '<line y1="' + Y(t) + '" y2="' + Y(t) + '" x1="' + M.l + '" x2="' + (W - M.r) + '" stroke="' + (t === 0 ? '#999' : '#eee') + '"/>' +
    '<text x="' + (M.l - 8) + '" y="' + (Y(t) + 4) + '" font-size="11" fill="#888" text-anchor="end">' + t + '</text>';
  g += '<text x="' + (W - M.r) + '" y="' + (H - M.b - 8) + '" font-size="12" fill="#555" text-anchor="end">' + LBL[kx] + '</text>';
  g += '<text x="' + (M.l + 8) + '" y="' + (M.t + 12) + '" font-size="12" fill="#555">' + LBL[ky] + '</text>';
  for (const s of rows.slice().sort((a, b) => b.turnover - a.turnover)) {
    const r = 3 + 17 * Math.sqrt(s.turnover / maxT);
    const a = Math.min(Math.abs(s.d ?? 0) / SCALE_SEC.d, 1) * 0.75 + 0.1;
    const col = (s.d ?? 0) >= 0 ? '214,69,61' : '26,152,80';
    g += '<circle cx="' + X(s[kx]).toFixed(1) + '" cy="' + Y(s[ky]).toFixed(1) + '" r="' + r.toFixed(1) +
      '" fill="rgba(' + col + ',' + a.toFixed(2) + ')" stroke="rgba(' + col + ',0.9)" stroke-width="0.8">' +
      '<title>' + s.name + '&#10;' + LBL[kx] + ' ' + fmt(s[kx]) + ' / ' + LBL[ky] + ' ' + fmt(s[ky]) +
      '&#10;當日 ' + fmt(s.d) + '% ・ 成交 ' + (s.turnover / 1e8).toFixed(0) + ' 億</title></circle>';
    if (labelSet.has(s)) g += '<text x="' + X(s[kx]).toFixed(1) + '" y="' + (Y(s[ky]) - r - 3).toFixed(1) +
      '" font-size="11" fill="#444" text-anchor="middle">' + s.name + '</text>';
  }
  g += '</svg>';
  document.getElementById('scBox').innerHTML = g;
}
document.getElementById('scX').onchange = renderScatter;
document.getElementById('scY').onchange = renderScatter;

// ---------- 共用 ----------
let view = 'table';
const HINTS = { table: '點欄位標題排序,點類股列展開成份股', map: '', scatter: '' };
function render() {
  document.getElementById('hint').textContent = HINTS[view];
  if (view === 'table') renderTable();
  else if (view === 'map') renderMap();
  else renderScatter();
}
document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  for (const v of ['table', 'map', 'scatter']) document.getElementById('v-' + v).style.display = v === view ? '' : 'none';
  render();
};
[...new Set(R.sectors.map(s => s.parent))].forEach(p => {
  const o = document.createElement('option'); o.value = o.textContent = p;
  document.getElementById('parentSel').appendChild(o);
});
document.getElementById('parentSel').onchange = () => { tmSector = null; render(); };
document.getElementById('search').oninput = render;
let rsz; window.onresize = () => { clearTimeout(rsz); rsz = setTimeout(() => { if (view === 'map') renderMap(); }, 150); };
render();
</script>
</body>
</html>
