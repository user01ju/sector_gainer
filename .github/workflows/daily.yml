name: Daily update

on:
  schedule:
    # 台北 15:05 / 16:05 / 17:05 / 18:05(UTC+8),週一~五
    # 盤後資料齊全時間不定,跑多次;fetch 對未齊的當天不寫檔,留待下一輪補抓
    - cron: '5 7-10 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_verify:
        description: '略過資料驗證直接 commit（確定是假警報、門檻還沒空修時的逃生門）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 補抓最近 7 天(防 runner 某天沒跑造成斷層),休市日自動略過
      - name: Fetch daily quotes
        run: node scripts/fetch_daily.mjs --backfill 7

      - name: Fetch ex-rights reference prices
        run: node scripts/fetch_exrights.mjs --backfill 7

      - name: Fetch market indices
        run: node scripts/fetch_index.mjs

      - name: Build report
        run: node scripts/build_report.mjs

      # 資料驗證 Tier A(零外部呼叫,見 VERIFICATION.md)。
      # 位置必須在下面的 commit step 之前:那一步的
      # `git diff --cached --quiet && echo "no changes" && exit 0`
      # 會在 TWSE 連續被擋、資料完全沒更新時讓 workflow 綠燈通過,報表默默停更。
      # exit 1 = FAIL(擋掉 commit 並讓 workflow 變紅);exit 2 = 只有 WARN,不擋。
      - name: Verify data (Tier A)
        if: github.event.inputs.skip_verify != 'true'
        run: |
          rc=0
          node scripts/verify.mjs --tier a || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Tier A 驗證有 WARN(exit 2),不擋 commit"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Tier A 驗證失敗(exit $rc),停止 commit"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily update $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
