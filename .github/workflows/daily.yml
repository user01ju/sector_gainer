name: Daily update

on:
  schedule:
    # 台北 15:05 / 16:05 / 17:05 / 18:05(UTC+8),週一~五
    # 盤後資料齊全時間不定,跑多次;fetch 對未齊的當天不寫檔,留待下一輪補抓
    - cron: '5 7-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 補抓最近 7 天(防 runner 某天沒跑造成斷層),休市日自動略過
      - name: Fetch daily quotes
        run: node scripts/fetch_daily.mjs --backfill 7

      - name: Fetch ex-rights reference prices
        run: node scripts/fetch_exrights.mjs --backfill 7

      - name: Fetch market indices
        run: node scripts/fetch_index.mjs

      - name: Build report
        run: node scripts/build_report.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily update $(TZ=Asia/Taipei date +%F)"
          git push
